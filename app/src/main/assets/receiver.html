<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>LAN Video Cast — Receiver</title>
<style>
:root{--accent:#2563EB;--bg:#0F1115;--card:#1A1D23;--text:#F3F4F6;--muted:#9CA3AF;--line:#2A2E36}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:18px}
h1{font-size:18px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.chip{margin-left:auto;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:700;background:#7f1d1d;color:#fff}
.chip.live{background:#166534}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{padding:10px 18px;border-radius:24px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{display:none}
.panel.active{display:block}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}
video,img.screen{width:100%;display:block;border-radius:12px;background:#000;max-height:70vh;object-fit:contain}
.row{display:flex;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}
button.act{padding:10px 16px;border:0;border-radius:22px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
button.act.sec{background:#2A2E36;color:var(--text)}
.meta{color:var(--muted);font-size:13px;margin-top:8px}
.big{font-size:16px;font-weight:700}
label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;cursor:pointer}
.foot{color:#6B7280;font-size:12px;text-align:center;margin-top:20px}
#gate{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.65);border-radius:12px;cursor:pointer}
#gate span{background:var(--accent);color:#fff;padding:14px 26px;border-radius:28px;font-weight:700;font-size:16px}
.stage{position:relative}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">LC</div>
    <div><h1>LAN Video Cast</h1><div class="sub">Phone se PC par live — local WiFi</div></div>
    <div id="chip" class="chip">CONNECTING</div>
  </header>

  <div class="tabs">
    <button class="tab active" data-tab="video">Video Cast</button>
    <button class="tab" data-tab="screen">Screen Cast</button>
  </div>

  <section id="panel-video" class="panel active">
    <div class="card">
      <div class="stage">
        <video id="v" src="/video" playsinline controls preload="metadata"></video>
        <div id="gate"><span>▶ Play karein</span></div>
      </div>
      <div class="row">
        <button class="act" id="playBtn">Pause</button>
        <button class="act sec" id="syncBtn">Sync: ON</button>
        <button class="act sec" id="fullBtn">Fullscreen</button>
      </div>
      <div class="meta"><span class="big" id="vname">—</span> <span id="vtime"></span></div>
      <div class="meta">Phone par play/pause/seek karo — yahan automatically follow karega. Sync OFF karke yahan se bhi control kar sakte ho.</div>
    </div>
  </section>

  <section id="panel-screen" class="panel">
    <div class="card">
      <div class="stage"><img id="screenImg" class="screen" src="/screen.jpg" alt="Phone screen"/></div>
      <div class="row"><span class="meta" id="screenMeta">Screen cast abhi start nahi hua</span></div>
    </div>
  </section>

  <div class="foot">Developed by Muhammad Kamran Malik</div>
</div>

<script>
const chip=document.getElementById('chip'), gate=document.getElementById('gate'), v=document.getElementById('v');
let syncOn=true, lastCmd=0, lastStatus=0, activeTab='video';

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); activeTab=t.dataset.tab;
  document.getElementById('panel-'+activeTab).classList.add('active');
  if(activeTab==='screen') document.getElementById('screenImg').src='/screen?t='+Date.now();
});

function play(){ v.play().then(()=>gate.style.display='none').catch(()=>{}); }
gate.onclick=play;
v.onclick=play;

document.getElementById('playBtn').onclick=()=>{
  if(v.paused){ v.play(); ctrl('play'); document.getElementById('playBtn').textContent='Pause'; }
  else { v.pause(); ctrl('pause'); document.getElementById('playBtn').textContent='Play'; }
};
document.getElementById('syncBtn').onclick=e=>{ syncOn=!syncOn; e.target.textContent='Sync: '+(syncOn?'ON':'OFF'); };
document.getElementById('fullBtn').onclick=()=>{ if(v.requestFullscreen) v.requestFullscreen(); };
v.addEventListener('seeked',()=>{ if(Date.now()-lastCmd>1200){ ctrl('seek&pos='+Math.round(v.currentTime*1000)); lastCmd=Date.now(); }});

function ctrl(action){ fetch('/control?action='+action).catch(()=>{}); }

async function tick(){
  try{
    const r=await fetch('/status?t='+Date.now(),{cache:'no-store'});
    const s=await r.json();
    lastStatus=Date.now();
    chip.textContent='LIVE'; chip.className='chip live';
    document.getElementById('vname').textContent=s.videoName||'Video select nahi kiya';
    if(s.videoDuration>0) document.getElementById('vtime').textContent=fmt(s.videoPosition)+' / '+fmt(s.videoDuration);
    if(activeTab==='video' && s.videoReady && syncOn){
      if(s.videoPlaying && v.paused){ v.play().then(()=>gate.style.display='none').catch(()=>{}); }
      if(!s.videoPlaying && !v.paused) v.pause();
      const drift=Math.abs(v.currentTime - s.videoPosition/1000)*1000;
      if(drift>900){ v.currentTime=s.videoPosition/1000; lastCmd=Date.now(); }
      document.getElementById('playBtn').textContent=s.videoPlaying?'Pause':'Play';
    }
    const sm=document.getElementById('screenMeta');
    if(s.screenActive) sm.textContent='Screen live • '+s.screenWidth+'x'+s.screenHeight;
    else sm.textContent='Screen cast abhi start nahi hua';
  }catch(e){ if(Date.now()-lastStatus>2500){ chip.textContent='OFFLINE'; chip.className='chip'; } }
  setTimeout(tick,500);
}
function fmt(ms){const x=Math.floor(ms/1000);return Math.floor(x/60)+':'+String(x%60).padStart(2,'0');}
tick();
</script>
</body>
</html>
